<svg width="140" height="40" viewBox="0 0 140 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main document with chat bubble overlay -->
  <g>
    <!-- Document background -->
    <rect x="4" y="6" width="28" height="36" rx="6" fill="url(#gradient)"/>
    
    <!-- Document lines -->
    <rect x="8" y="12" width="20" height="2" fill="white" opacity="0.9"/>
    <rect x="8" y="16" width="16" height="2" fill="white" opacity="0.7"/>
    <rect x="8" y="20" width="18" height="2" fill="white" opacity="0.7"/>
    <rect x="8" y="24" width="14" height="2" fill="white" opacity="0.7"/>
    <rect x="8" y="28" width="12" height="2" fill="white" opacity="0.7"/>
    
    <!-- Chat bubble -->
    <ellipse cx="24" cy="18" rx="8" ry="6" fill="white" opacity="0.95"/>
    <path d="M20 24l-3 3v-2c-1.5-1-2.5-2.8-2.5-5 0-3.3 2.7-6 6-6s6 2.7 6 6c0 2.2-1 4-2.5 5v2l-3-3z" fill="white" opacity="0.95"/>
    
    <!-- AI sparkles -->
    <circle cx="26" cy="14" r="1" fill="url(#gradient)"/>
    <circle cx="30" cy="20" r="0.8" fill="url(#gradient)"/>
    <circle cx="22" cy="22" r="0.6" fill="url(#gradient)"/>
  </g>
  
  <!-- Brand text -->
  <text x="50" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="url(#gradient)">Chat</text>
  <text x="50" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#374151">2Doc</text>
  
  <!-- Tagline -->
  <text x="50" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="500" fill="#6B7280">AI Document Intelligence</text>
  
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="140" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
</svg>